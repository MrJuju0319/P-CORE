server:
  identity:
    serverId: "survival-01"
  presence:
    enabled: true
    heartbeatIntervalSeconds: 5
    ttlSeconds: 15

security:
  sharedSecret: "CHANGE_ME_SUPER_SECRET"
  allowedPlugins: ["p-2FA", "p-fly", "p-tp", "p-voteparty"]

db:
  host: "127.0.0.1"
  port: 3306
  database: "p-core"
  user: "root"
  password: "password"
  poolSize: 10
  minIdle: 2
  connectionTimeoutMs: 3000
  idleTimeoutMs: 60000
  maxLifetimeMs: 1800000

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  ssl: false
  timeoutMs: 1000
  dbIndex: 0

namespaces:
  p-2FA: "p-2FA"
  p-fly: "p-fly"
  p-tp: "p-tp"
  p-voteparty: "p-voteparty"

plugins:
  p-2FA:
    enabled: true
    tablePrefix: "p-2FA_"
    cachePrefix: "pcore:p-2FA"
  p-fly:
    enabled: true
    tablePrefix: "p-fly_"
    cachePrefix: "pcore:p-fly"
  p-tp:
    enabled: true
    tablePrefix: "p-tp_"
    cachePrefix: "pcore:p-tp"
  p-voteparty:
    enabled: true
    tablePrefix: "p-voteparty_"
    cachePrefix: "pcore:p-voteparty"
